<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skin Atelier">
<meta name="theme-color" content="#F1F5F9">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Skin Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F1F5F9; --surface:#FFFFFF; --surface-2:#E3EBF3; --ink:#14233A; --ink-2:#4E5E74; --ink-3:#8593A6;
  --line:#D5DFEA; --accent:#1B6FB8; --accent-soft:#DCEBF8; --on-accent:#FFFFFF; --gold:#C9962E; --gold-ink:#8E6410; --gold-soft:#F7EBCF;
  --red:#C8323A; --red-soft:#FBE3E4; --warn:#C8323A; --warn-soft:#FBE3E4;
  --hero1:#1C6DB5; --hero2:rgba(125,195,248,.55); --hero3:#0F3F78;
  --round:"Nunito","SF Pro Rounded",ui-rounded,-apple-system,sans-serif;
  --sans:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1524; --surface:#121E31; --surface-2:#1A2840; --ink:#E6EEF8; --ink-2:#A3B3C8; --ink-3:#6C7D94;
    --line:#22324B; --accent:#5AA6E8; --accent-soft:#16304F; --on-accent:#08111E; --gold:#E2B654; --gold-ink:#E2B654; --gold-soft:#3A2E14;
    --red:#F0727A; --red-soft:#3A1C22; --warn:#F0727A; --warn-soft:#3A1C22;
    --hero1:#174E86; --hero2:rgba(90,166,232,.35); --hero3:#0A2442;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1524; --surface:#121E31; --surface-2:#1A2840; --ink:#E6EEF8; --ink-2:#A3B3C8; --ink-3:#6C7D94;
  --line:#22324B; --accent:#5AA6E8; --accent-soft:#16304F; --on-accent:#08111E; --gold:#E2B654; --gold-ink:#E2B654; --gold-soft:#3A2E14;
  --red:#F0727A; --red-soft:#3A1C22; --warn:#F0727A; --warn-soft:#3A1C22;
  --hero1:#174E86; --hero2:rgba(90,166,232,.35); --hero3:#0A2442;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding:12px 20px calc(110px + env(safe-area-inset-bottom,0px))}

.brand{display:flex;justify-content:space-between;align-items:center;padding:6px 0 20px}
.wordmark{font-family:var(--round);font-size:19px;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;gap:9px}
.wordmark img{width:26px;height:26px;border-radius:7px}
.wordmark span{color:var(--red)}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync i{background:var(--accent)!important}

h1,h2,h3{margin:0}
.display{font-family:var(--round);font-size:30px;font-weight:800;line-height:1.12;letter-spacing:-.01em}
.lede{color:var(--ink-2);margin:10px 0 0;font-size:15px;max-width:36ch}
h2.sec{font-family:var(--round);font-size:20px;font-weight:800}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}.small{font-size:13px}
.view{display:none}.view.on{display:block}

.today-card{position:relative;overflow:hidden;padding:26px 22px 24px;border-radius:26px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,var(--hero2) 0%,transparent 62%),linear-gradient(160deg,var(--hero1),var(--hero3))}
.today-card::after{content:"";position:absolute;left:22px;bottom:0;width:56px;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,var(--red),var(--gold))}
.today-card .display{color:#fff}
.today-card .lede{color:rgba(255,255,255,.82)}
.hero{display:grid;grid-template-columns:118px 1fr;gap:20px;align-items:center;margin:22px 0 0}
.ring{position:relative;width:118px;height:118px}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:rgba(255,255,255,.22)}
.ring .bar{stroke:#fff;transition:stroke-dashoffset .6s ease}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--round);font-size:28px;font-weight:800}
.ring .val small{font-size:14px;font-weight:700;color:rgba(255,255,255,.6)}
.hero-meta p{margin:0}
.hero-meta .big{font-family:var(--round);font-size:18px;font-weight:700;line-height:1.3}
.hero-meta .sub{color:rgba(255,255,255,.75);font-size:14px;margin-top:4px}

.water{margin-top:16px;padding:18px 18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:22px}
.water-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.water-top b{font-family:var(--round);font-size:20px;font-weight:800}
.water-top b small{font-size:14px;color:var(--ink-3);font-weight:700}
.water-top span{font-size:13px;color:var(--ink-2)}
.glasses{display:grid;grid-template-columns:repeat(auto-fit,minmax(30px,1fr));gap:6px;margin:14px 0 12px}
.glass{border:0;background:transparent;padding:4px 0;cursor:pointer;color:var(--line);display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.glass svg{width:26px;height:32px}
.glass .fillp{fill:transparent;transition:fill .25s}
.glass.on{color:var(--accent)}
.glass.on .fillp{fill:var(--accent-soft)}
.water-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px}
.water-bottom p{margin:0;font-size:13.5px;color:var(--ink-2)}
.water-bottom p.behind{color:var(--red)}
.water-bottom p.done{color:var(--accent)}

.block{margin-top:34px}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.block-head .time{font-size:13px;color:var(--ink-3)}
.night-tag{display:inline-block;margin-top:6px;font-size:13px;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px}
.night-tag.aha{color:var(--gold-ink);background:var(--gold-soft)}
.night-tag.aze{color:var(--red);background:var(--red-soft)}
.night-tag.rest{color:var(--ink-2);background:var(--surface-2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;vertical-align:1px}
.dot.bha{background:var(--accent)}.dot.aha{background:var(--gold)}.dot.aze{background:var(--red)}.dot.rest{background:var(--ink-3)}

.steps{list-style:none;margin:10px 0 0;padding:0}
.step{display:grid;grid-template-columns:26px 1fr auto;gap:14px;padding:15px 0;border-top:1px solid var(--line);align-items:start;cursor:pointer;-webkit-tap-highlight-color:transparent}
.step:last-child{border-bottom:1px solid var(--line)}
.check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;margin-top:1px;transition:background .2s,border-color .2s}
.check svg{opacity:0;transition:opacity .2s}
.step.done .check{background:var(--accent);border-color:var(--accent)}
.step.done .check svg{opacity:1}
.step.done .s-name{color:var(--ink-3)}
.s-name{font-weight:500;font-size:15.5px}
.s-detail{font-size:13.5px;color:var(--ink-2);margin-top:2px;line-height:1.45}
.opt{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:6px}
.wait-btn{font-size:12.5px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;color:var(--ink-2);cursor:pointer;white-space:nowrap}

.note{margin-top:16px;padding:14px 16px;border-left:2px solid var(--gold);background:var(--surface);font-size:14px;color:var(--ink-2);border-radius:0 12px 12px 0}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
.row-toggle{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:22px}
.row-toggle p{margin:0}
.switch{position:relative;width:50px;height:30px;flex:none;border:0;padding:0;background:var(--surface-2);border-radius:999px;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--warn)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:500;border-radius:999px;padding:12px 22px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;text-decoration:none}
.btn.blue{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:8px 15px;font-size:13.5px;white-space:nowrap}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.linkrow{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:14px 18px;border:1px dashed var(--line);border-radius:16px;color:var(--ink-2);font-size:14px;text-decoration:none}
.linkrow b{color:var(--accent);font-weight:500}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn:disabled{opacity:.3}
.datebar .d{text-align:center}
.datebar .d strong{display:block;font-family:var(--round);font-size:19px;font-weight:800;line-height:1.2}

.metric{padding:16px 0;border-top:1px solid var(--line)}
.metric:last-child{border-bottom:1px solid var(--line)}
.metric-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.metric-top b{font-weight:500}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer;font-size:14px}
.scale button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
textarea{width:100%;min-height:92px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:15px;resize:vertical}
input[type="text"],input[type="date"],select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px;min-width:0}
.saved{font-size:12.5px;color:var(--ink-3);margin-top:8px;min-height:18px}
.ai-saved{margin-top:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-size:14.5px}
.ai-saved p{margin:0 0 8px}.ai-saved ul{margin:4px 0 8px;padding-left:18px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:16px 0 14px}
.stat+.stat{padding-left:14px;border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--round);font-size:28px;font-weight:800;line-height:1.1}
.stat span{font-size:12.5px;color:var(--ink-2)}
.stat:nth-child(1) b{color:var(--red)}.stat:nth-child(2) b{color:var(--accent)}.stat:nth-child(3) b{color:var(--gold-ink)}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--gold);stroke-width:1.2;stroke-dasharray:4 4}
.chart .lbl{fill:var(--ink-3);font-size:10px;font-family:var(--sans)}
.chart .line{stroke:var(--accent);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .dot2{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}
.chart .barr{fill:var(--accent)}
.chart .barr.part{opacity:.4}
.chart .barr.zero{fill:var(--line);opacity:1}

.cal-head{display:flex;justify-content:space-between;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cal .wd{font-size:11px;color:var(--ink-3);text-align:center;padding-bottom:2px}
.cal button{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:transparent;position:relative;font-size:13px;cursor:pointer;color:var(--ink-2);padding:0}
.cal button.blank{visibility:hidden}
.cal button.today{border-color:var(--ink)}
.cal button.future{opacity:.35;cursor:default}
.cal button .pip{position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-3);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.quick{display:grid;gap:10px;margin-top:18px}
.quick button{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:12px;padding:15px 18px;border:1px solid var(--line);background:var(--surface);border-radius:16px;cursor:pointer}
.quick button b{display:block;font-weight:500;font-size:15px}
.quick button span{font-size:13px;color:var(--ink-2)}
.quick button:disabled{opacity:.5;cursor:default}
.chat{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.msg{max-width:88%;padding:12px 15px;border-radius:18px;font-size:15px;line-height:1.55}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.ai p{margin:0 0 8px}.msg.ai p:last-child{margin:0}
.msg.ai ul{margin:4px 0 8px;padding-left:18px}.msg.ai li{margin:3px 0}
.msg.ai h4{font-size:15px;font-weight:600;margin:10px 0 4px}
.msg .thinking{color:var(--ink-3)}
.composer{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;margin-top:18px;padding:10px 0;background:var(--bg)}
.composer textarea{min-height:46px;height:46px;border-radius:23px;padding:11px 16px;resize:none}
.composer .btn{flex:none}

.week{list-style:none;padding:0;margin:12px 0 0}
.week li{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--line);font-size:14.5px}
.week li:last-child{border-bottom:1px solid var(--line)}
.week li.cur{color:var(--accent)}
.week li.cur b{font-weight:600}
.week .mk{font-size:12.5px;color:var(--gold-ink);display:block;margin-left:17px}
.prod{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:center}
.prod:last-of-type{border-bottom:1px solid var(--line)}
.pimg{width:56px;height:56px;border-radius:14px;border:1px dashed var(--ink-3);background:var(--surface);display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:0;color:var(--ink-3)}
.pimg.has{border:1px solid var(--line)}
.pimg img{width:100%;height:100%;object-fit:cover}
.prod .pn{font-weight:500;font-size:15px;line-height:1.35}
.prod .pm{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.prod .pm.warn{color:var(--warn)}
.prod input[type="date"]{padding:5px 8px;font-size:12.5px;margin-top:6px;width:150px}
.iconbtn.armed{background:var(--red);border-color:var(--red);color:#fff}
.linkbtn{border:0;background:none;color:var(--accent);font-size:12.5px;padding:4px 6px;margin-left:4px;cursor:pointer}
.addprod{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:14px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.setrow:last-child{border-bottom:1px solid var(--line)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-3);text-decoration:none;min-width:62px;padding:4px 2px;-webkit-tap-highlight-color:transparent}
.nav a[aria-current="page"]{color:var(--accent)}
.nav svg{width:23px;height:23px}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:21;display:none;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:999px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.timer.on{display:flex}
.timer b{font-family:var(--round);font-size:18px;font-weight:800;min-width:52px}
.timer button{border:0;background:transparent;color:var(--bg);opacity:.7;cursor:pointer;font-size:13px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;z-index:30;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;max-width:88vw;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{padding:20px 0;color:var(--ink-2);font-size:14.5px}
.foot{font-size:12px;color:var(--ink-3);margin-top:28px;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
details.sec{border-top:1px solid var(--line);margin-top:22px}
details.sec>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
details.sec>summary::-webkit-details-marker{display:none}
details.sec .chev{transition:transform .2s;color:var(--ink-3);vertical-align:-2px;margin-left:6px}
details.sec[open]>summary .chev{transform:rotate(180deg)}
details.sec>.week{margin-top:0}
details.more>summary{list-style:none;cursor:pointer;color:var(--accent);font-size:14px;padding:14px 0 4px}
details.more>summary::-webkit-details-marker{display:none}
.card{margin-top:16px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:22px}
.card h3{font-family:var(--round);font-size:17px;font-weight:800;margin:0 0 4px}
.card p{margin:0;font-size:14px;color:var(--ink-2)}
.card .bar{height:6px;border-radius:6px;background:var(--surface-2);margin-top:12px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini div{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.mini b{display:block;font-family:var(--round);font-size:20px;font-weight:800}
.mini span{font-size:12px;color:var(--ink-2)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px;font-weight:500}
.tag.low{background:var(--red-soft);color:var(--red)}
.tag.trial{background:var(--accent-soft);color:var(--accent)}
.ptools{display:flex;flex-wrap:wrap;margin-top:2px}

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const keyOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayKey = () => keyOf(new Date(Date.now() - 4 * 3600e3));
const parseKey = k => { const p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const WD = ["Chủ Nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];
const fmtLong = k => { const d = parseKey(k); return WD[d.getDay()] + ", " + d.getDate() + " tháng " + (d.getMonth() + 1); };
const fmtShort = k => { const d = parseKey(k); return d.getDate() + "/" + (d.getMonth() + 1); };
const fmtFull = k => { const d = parseKey(k); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear(); };
const fmtMl = n => n.toLocaleString("vi-VN") + " ml";
const CHECK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--on-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const GLASS = '<svg viewBox="0 0 26 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path class="fillp" stroke="none" d="M5.2 11h15.6l-1.5 17.2a2 2 0 0 1-2 1.8H8.7a2 2 0 0 1-2-1.8z"/><path d="M3.5 3h19l-2.2 25.2a2 2 0 0 1-2 1.8H7.7a2 2 0 0 1-2-1.8z"/></svg>';
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }

/* ---------- routine ---------- */
const MORNING = [
  {id:"cleanse", name:"Sữa rửa mặt dịu nhẹ"},
  {id:"niac", name:"Niacinamide 10% + Zinc 1%", detail:"The Ordinary. 2 đến 3 giọt, thoa lớp mỏng để kiềm dầu và làm sáng"},
  {id:"moist", name:"Kem dưỡng ẩm mỏng nhẹ", detail:"Có thể bỏ qua nếu kem chống nắng đã đủ ẩm", optional:true},
  {id:"spf", name:"Kem chống nắng SPF 30 đến 50+", detail:"Nên dùng mỗi ngày vì da đang dùng acid. Bôi đủ lượng, thoa lại nếu ra nắng lâu", optional:true}
];
const NIGHTS = {
  bha:{label:"BHA", title:"Salicylic Acid (BHA)", goal:"Đẩy mụn ẩn, làm thông thoáng lỗ chân lông"},
  aha:{label:"AHA", title:"Lactic Acid (AHA)", goal:"Làm sáng, mờ vùng xỉn màu"},
  aze:{label:"Azelaic", title:"Azelaic Acid, Skinoren 20%", goal:"Điều trị mụn, thâm và làm đều màu da"},
  rest:{label:"Phục hồi", title:"Đêm phục hồi", goal:"Không hoạt chất, để hàng rào bảo vệ da nghỉ ngơi"}
};
const SCHEDULE = ["rest","bha","aha","aze","bha","aha","aze"];
const MASK_DAYS = [0, 4];
const dowOf = k => parseKey(k).getDay();
const isMaskDay = k => MASK_DAYS.includes(dowOf(k));
function nightType(k, rec){ return rec && rec.sensitive ? "rest" : SCHEDULE[dowOf(k)]; }
function eveningSteps(k, rec){
  const type = nightType(k, rec), mask = isMaskDay(k);
  const s = [{id:"remover", name:"Tẩy trang"}, {id:"cleanse", name:"Sữa rửa mặt", detail:"Lau khô nhẹ, đợi da khô ráo trước khi thoa hoạt chất"}];
  const maskStep = {id:"mask", name:"Mặt nạ cấp ẩm, làm dịu", wait:15,
    detail: type === "rest" ? "Đắp 10 đến 15 phút ngay sau khi rửa mặt" : "Đắp sau khi đợi acid xong, 10 đến 15 phút. Chọn loại không chứa acid hay retinol"};
  if (type === "bha" || type === "aha"){
    s.push(type === "bha"
      ? {id:"bha", name:"Salicylic Acid (BHA)", detail:"Thoa vùng mụn ẩn, dầu nhiều, hoặc toàn mặt nếu da đã quen. Đợi 15 đến 20 phút", wait:20}

const state = {days:{}, products:null, settings:null, sync:"local", logDate:todayKey(), calMonth:null, chat:[], busy:false, imgFor:null, open:new Set(["evening","products"])};
const blankDay = k => ({date:k, morning:{}, evening:{}, sensitive:false, metrics:{}, factors:[], note:"", water:0});

const ensureDay = k => state.days[k] || (state.days[k] = blankDay(k));

function completion(k){
  const rec = state.days[k];
  const m = MORNING.filter(s => !s.optional), e = eveningSteps(k, rec).filter(s => !s.optional);
  const dm = rec ? m.filter(s => rec.morning && rec.morning[s.id]).length : 0;
  const de = rec ? e.filter(s => rec.evening && rec.evening[s.id]).length : 0;
  return {dm, tm:m.length, de, te:e.length, done:dm + de, total:m.length + e.length, pct:(dm + de) / (m.length + e.length)};
}
function skinScore(rec){
  if (!rec || !rec.metrics) return null;
  const vals = METRICS.filter(m => rec.metrics[m.id]).map(m => { const v = rec.metrics[m.id]; return m.bad ? (5 - v) / 4 : (v - 1) / 4; });
  if (!vals.length) return null;
  return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length * 100);
}
function streak(){
  let k = todayKey(); if (completion(k).pct < 1) k = addDays(k, -1);
  let n = 0; while (state.days[k] && completion(k).pct >= 1){ n++; k = addDays(k, -1); }
  return n;
}
function adherence(days){
  const keys = Object.keys(state.days).sort(); if (!keys.length) return null;
  const t = todayKey(); let start = addDays(t, -(days - 1)); if (keys[0] > start) start = keys[0];
  let sum = 0, n = 0; for (let k = start; k <= t; k = addDays(k, 1)){ sum += completion(k).pct; n++; }
  return n ? Math.round(sum / n * 100) : null;
}

/* ---------- local storage ---------- */
let idb = null;
const memKV = new Map(), memImg = new Map();
function openIDB(){
  return new Promise(res => {
    try {
      const r = indexedDB.open("skin-atelier", 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
        if (d.objectStoreNames.contains("photos")) d.deleteObjectStore("photos"); // xóa ảnh mặt cũ trên máy
        if (!d.objectStoreNames.contains("prodimg")) d.createObjectStore("prodimg");
      };
      r.onsuccess = () => res(r.result); r.onerror = () => res(null);
    } catch (e){ res(null); }
  });
}
function idbReq(store, mode, fn){
  return new Promise(res => {
    if (!idb){ res(undefined); return; }
    try { const t = idb.transaction(store, mode); const q = fn(t.objectStore(store)); t.oncomplete = () => res(q && q.result); t.onerror = () => res(undefined); }
    catch (e){ res(undefined); }
  });
}
const kvPut = (k, v) => idb ? idbReq("kv", "readwrite", s => s.put(v, k)) : (memKV.set(k, v), Promise.resolve());
const imgPut = (k, v) => idb ? idbReq("prodimg", "readwrite", s => s.put(v, k)) : (memImg.set(k, v), Promise.resolve());
const imgGet = k => idb ? idbReq("prodimg", "readonly", s => s.get(k)) : Promise.resolve(memImg.get(k));
const imgDel = k => idb ? idbReq("prodimg", "readwrite", s => s.delete(k)) : (memImg.delete(k), Promise.resolve());
function kvAll(){
  return new Promise(res => {
    if (!idb){ res([...memKV.entries()]); return; }
    const out = [];
    try {
      const t = idb.transaction("kv", "readonly"); const q = t.objectStore("kv").openCursor();
      q.onsuccess = () => { const c = q.result; if (c){ out.push([c.key, c.value]); c.continue(); } };
      t.oncomplete = () => res(out); t.onerror = () => res(out);
    } catch (e){ res(out); }
  });
}

/* ---------- cloud sync (chỉ dữ liệu chữ, không có ảnh) ---------- */
let remote = null, sampleCap = null;
const chains = {};
const docId = k => k.replace(/[^a-zA-Z0-9]/g, "_");
function remotePut(key, obj){
  if (!remote) return;
  const id = docId(key), body = JSON.parse(JSON.stringify(Object.assign({}, obj, {_k:key})));
  chains[id] = (chains[id] || Promise.resolve()).then(() => remote.col.doc(id).set(body)).catch(e => console.warn("sync", e));
}
function lsPut(key, obj){ try { localStorage.setItem("sa:" + key, JSON.stringify(obj)); } catch (e){} }
function put(key, obj){ obj.updatedAt = Date.now(); kvPut(key, obj); lsPut(key, obj); }
function saveDay(k){ put("day:" + k, ensureDay(k)); }
const saveProducts = () => put("products", state.products);
const saveSettings = () => put("settings", state.settings);
function applyRecord(key, val){
  if (key.startsWith("day:")) state.days[key.slice(4)] = val;
  else if (key === "products") state.products = val;
  else if (key === "settings") state.settings = val;
}
function currentOf(key){ return key.startsWith("day:") ? state.days[key.slice(4)] : key === "products" ? state.products : key === "settings" ? state.settings : null; }

function stripPhotos(){

async function purgeCloudPhotos(assets){

async function initCloud(){
  if (!window.claude || typeof window.claude.use !== "function"){ setSync(); return; }
  const use = n => window.claude.use(n).catch(() => null);
  const [db, user, sample, assets] = await Promise.all([use("db"), use("user"), use("sample"), use("assets")]);
  sampleCap = sample;
  if (db && user){
    let uid = null; try { uid = await user.id(); } catch (e){}
    if (uid){
      remote = {col: db.collection("data/users/" + uid)};
      try {
        const snap = await Promise.race([remote.col.get(), new Promise((_, r) => setTimeout(() => r(new Error("timeout")), 10000))]);
        const seen = {};
        snap.docs.forEach(d => {
          const v = d.data(); if (!v || !v._k) return;
          const k = v._k; seen[k] = v.updatedAt || 0;
          const cur = currentOf(k);
          if (!cur || (v.updatedAt || 0) > (cur.updatedAt || 0)){ const c = Object.assign({}, v); delete c._k; applyRecord(k, c); kvPut(k, c); }
        });
        const localKeys = Object.keys(state.days).map(k => "day:" + k)
          .concat(state.products && state.products.updatedAt ? ["products"] : [])
          .concat(state.settings && state.settings.updatedAt ? ["settings"] : []);
        localKeys.forEach(k => { const cur = currentOf(k); if (cur && (!(k in seen) || (cur.updatedAt || 0) > seen[k])) remotePut(k, cur); });
        state.sync = "cloud";
      } catch (e){ state.sync = "offline"; }
    }
  }
  stripPhotos();
  if (assets) purgeCloudPhotos(assets);
  setSync(); render();
}

async function compress(file, max){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}
async function setProdImage(id, file){
  const p = state.products.items.find(x => x.id === id); if (!p) return;
  try {
    const b = await compress(file, 200);
    if (!b) throw new Error("empty");
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
    p.img = url; delete p.hasImg;

}

/* ---------- water ---------- */
function waterPace(k){
  const n = getDay(k).water || 0, g = goal();
  if (n >= g) return {cls:"done", text:"Đủ nước hôm nay. Làn da cảm ơn bạn."};
  if (k !== todayKey()) return {cls:"", text:"Còn thiếu " + (g - n) + " ly."};
  const now = new Date(), h = now.getHours() + now.getMinutes() / 60;
  const start = 8, end = 22;
  const expected = h <= start ? 0 : h >= end ? g : Math.floor(g * (h - start) / (end - start));
  const every = (end - start) / g;
  const nextH = Math.min(end, start + every * (n + 1));
  const nextTxt = pad(Math.floor(nextH)) + ":" + pad(Math.round((nextH % 1) * 60) % 60);
  if (n < expected) return {cls:"behind", text:"Đang chậm " + (expected - n) + " ly so với nhịp. Uống 1 ly ngay nhé."};
  return {cls:"", text:"Đúng nhịp. Ly tiếp theo khoảng " + nextTxt + "."};
}
function waterCard(k){
  const n = getDay(k).water || 0, g = goal(), p = waterPace(k);
  let gl = ""; for (let i = 0; i < Math.max(g, n); i++) gl += '<button class="glass' + (i < n ? " on" : "") + '" data-action="glass" data-i="' + i + '" data-k="' + k + '" aria-label="Ly thứ ' + (i + 1) + '">' + GLASS + '</button>';
  return '<div class="water"><div class="water-top"><b>' + n + '<small> / ' + g + ' ly nước</small></b><span>' + fmtMl(n * glassMl()) + ' trên ' + fmtMl(g * glassMl()) + '</span></div>' +
    '<div class="glasses">' + gl + '</div>' +
    '<div class="water-bottom"><p class="' + p.cls + '">' + esc(p.text) + '</p><button class="btn blue sm" data-action="water-add" data-k="' + k + '">Thêm 1 ly</button></div></div>';
}

function chartScore(){
  const t = todayKey(), pts = [];
  for (let i = 29; i >= 0; i--){ const k = addDays(t, -i); const sc = skinScore(state.days[k]); if (sc != null) pts.push({i:29 - i, k, sc}); }
  if (pts.length < 2) return '<p class="empty">Ghi nhật ký da ít nhất 2 ngày để thấy xu hướng.</p>';
  const W = 340, H = 160, px = 22, py = 14, x = i => px + i * (W - px - 6) / 29, y = v => py + (100 - v) * (H - 2 * py) / 100;
  let g = ""; [0, 50, 100].forEach(v => { g += '<line class="grid" x1="' + px + '" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="lbl" x="0" y="' + (y(v) + 3) + '">' + v + '</text>'; });
  const d = pts.map((p, j) => (j ? "L" : "M") + x(p.i).toFixed(1) + " " + y(p.sc).toFixed(1)).join(" ");
  const dots = pts.map(p => '<circle class="dot2" cx="' + x(p.i).toFixed(1) + '" cy="' + y(p.sc).toFixed(1) + '" r="3"/>').join("");
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 14) + '" role="img" aria-label="Điểm da 30 ngày">' + g + '<path class="line" d="' + d + '"/>' + dots +
    '<text class="lbl" x="' + px + '" y="' + (H + 12) + '">' + fmtShort(addDays(t, -29)) + '</text><text class="lbl" x="' + W + '" y="' + (H + 12) + '" text-anchor="end">Hôm nay</text></svg>';
}
function barChart(valueOf, label, goalLine){
  const t = todayKey(), W = 340, H = 90, n = 14, gap = 6, bw = (W - gap * (n - 1)) / n, top = H - 16;
  let bars = "";
  for (let i = 0; i < n; i++){
    const k = addDays(t, -(n - 1 - i)), p = Math.min(1, valueOf(k)), h = Math.max(3, p * top);
    bars += '<rect class="barr' + (p >= 1 ? "" : p > 0 ? " part" : " zero") + '" x="' + (i * (bw + gap)).toFixed(1) + '" y="' + (top - h + 2).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3"/>';
    if (i === 0 || i === n - 1) bars += '<text class="lbl" x="' + (i === 0 ? 0 : W) + '" y="' + H + '"' + (i ? ' text-anchor="end"' : '') + '>' + (i ? "Hôm nay" : fmtShort(k)) + '</text>';
  }
  const gl = goalLine ? '<line class="goal" x1="0" x2="' + W + '" y1="2" y2="2"/>' : "";
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 2) + '" role="img" aria-label="' + esc(label) + '">' + gl + bars + '</svg>';
}
function calendar(){

  for (let i = 0; i < lead; i++) cells += '<button class="blank" tabindex="-1" aria-hidden="true"></button>';
  for (let d = 1; d <= days; d++){
    const k = keyOf(new Date(y, m, d)), rec = state.days[k], fut = k > t;
    const p = rec ? completion(k).pct : 0;

function md(text){
  const lines = esc(text).split(/\n/); let out = "", inList = false;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  lines.forEach(l => {
    const t = l.trim();
    if (/^[-*•]\s+/.test(t)){ if (!inList){ out += "<ul>"; inList = true; } out += "<li>" + inline(t.replace(/^[-*•]\s+/, "")) + "</li>"; return; }
    if (inList){ out += "</ul>"; inList = false; }
    if (!t) return;
    if (/^#{1,4}\s+/.test(t)) out += "<h4>" + inline(t.replace(/^#{1,4}\s+/, "")) + "</h4>";
    else out += "<p>" + inline(t) + "</p>";
  });
  if (inList) out += "</ul>";
  return out;
}

function prodMeta(p){
  if (!p.opened) return {meta:"Chưa ghi ngày mở nắp", warn:false};
  const exp = parseKey(p.opened); exp.setMonth(exp.getMonth() + Number(p.pao || 12));
  const left = Math.round((exp - parseKey(todayKey())) / 864e5);
  return {meta: left < 0 ? "Quá hạn dùng sau mở " + (-left) + " ngày" : "Còn " + left + " ngày dùng tốt", warn: left < 30};
}
function onOpened(el){
  const p = state.products.items.find(x => x.id === el.dataset.id);
  if (!p || p.opened === el.value) return;
  p.opened = el.value; saveProducts();
  const pm = prodMeta(p), box = document.getElementById("pm-" + p.id);
  if (box){ box.textContent = pm.meta + ", hạn " + p.pao + " tháng sau mở"; box.classList.toggle("warn", pm.warn); }
  if (!el.value) toast("Đã xóa ngày mở nắp");
}

      '<div class="addprod"><input type="text" id="pname" placeholder="Tên sản phẩm mới"><select id="ppao" aria-label="Hạn dùng sau mở"><option value="3">3 tháng</option><option value="6">6 tháng</option><option value="12" selected>12 tháng</option><option value="24">24 tháng</option></select><button class="btn sm" data-action="addprod">Thêm</button></div>') +
    secWrap("water", "Uống nước", goal() + " ly mỗi ngày",
      '<div class="setrow"><span>Mục tiêu mỗi ngày</span><select data-action="wgoal" aria-label="Mục tiêu số ly">' + gOpts + '</select></div>' +
      '<div class="setrow"><span>Dung tích mỗi ly</span><select data-action="wml" aria-label="Dung tích ly">' + mOpts + '</select></div>') +
    secWrap("backup", "Sao lưu dữ liệu", state.settings.lastBackup ? "Lần cuối " + fmtShort(state.settings.lastBackup) : "Chưa sao lưu",
      '<p class="muted small" style="margin:0 0 12px">Dữ liệu chỉ nằm trên iPhone này. Nên sao lưu mỗi 2 tuần và lưu file vào app Tệp hoặc iCloud Drive. Khi đổi máy hoặc lỡ xóa app, dùng Khôi phục để lấy lại.</p>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><button class="btn blue sm" data-action="backup">Tải bản sao lưu</button><button class="btn ghost sm" data-action="restore">Khôi phục từ file</button></div>') +
    secWrap("reminders", "Lời nhắc", "", '<p class="muted small" style="margin:0 0 8px">Nhắc skincare lúc 9:00, 23:00 và nhắc uống nước nằm trong app Lời nhắc của iPhone.</p>') +
    '<p class="foot">Mọi dữ liệu chỉ lưu trên iPhone này, không gửi đi đâu.</p>';
  hydrateProducts($("#v-routine"));
  $("#v-routine").querySelectorAll('input[data-action="opened"]').forEach(i => { i.value = i.dataset.val || ""; });
}

function render(){
  const v = currentView();
  VIEWS.forEach(n => $("#v-" + n).classList.toggle("on", n === v));
  document.querySelectorAll(".nav a").forEach(a => { if (a.dataset.nav === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  ({today:renderToday, checkin:renderCheckin, progress:renderProgress, routine:renderRoutine})[v]();
}

/* ---------- AI advisor ---------- */
const RULES = "Bạn là chuyên gia tư vấn chăm sóc da trong ứng dụng cá nhân Skin Atelier. Trả lời bằng tiếng Việt, gọi người dùng là bạn. Văn phong chuyên nghiệp, ấm áp, ngắn gọn. Dùng tiêu đề ngắn và gạch đầu dòng. Không dùng dấu gạch ngang dài. Không chẩn đoán bệnh. Bạn không xem ảnh; chỉ dựa vào chỉ số tự chấm, ghi chú, yếu tố trong ngày, lượng nước và mức tuân thủ quy trình. Tìm mối liên hệ cụ thể (ví dụ ngày dùng acid với chỉ số đỏ rát, ngủ ít hoặc uống ít nước với mụn, khô). Đưa gợi ý thực tế cho tối nay và vài ngày tới, bám vào sản phẩm người dùng đang có; chỉ đề xuất sản phẩm mới khi thật sự cần. Nếu thấy dấu hiệu kích ứng kéo dài, khuyên bật chế độ da nhạy cảm và giảm tần suất acid. Nếu có mụn viêm nặng hoặc kích ứng kéo dài hơn vài ngày, khuyên gặp bác sĩ da liễu. Giữ câu trả lời dưới khoảng 250 chữ trừ khi được hỏi chi tiết.";
function buildContext(){
  const t = todayKey(), L = [];
  L.push("NGỮ CẢNH (dữ liệu từ app):");
  L.push("Hôm nay: " + fmtLong(t) + " " + fmtFull(t) + ". Tối nay: " + NIGHTS[nightType(t, state.days[t])].title + (isMaskDay(t) ? ", có đắp mặt nạ" : "") + ".");
  L.push("Quy trình sáng mỗi ngày: sữa rửa mặt dịu nhẹ, The Ordinary Niacinamide 10% + Zinc 1%, kem dưỡng mỏng nhẹ (tùy chọn), kem chống nắng SPF 30 đến 50+.");
  L.push("Lịch tối: Thứ Hai và Thứ Năm Salicylic Acid (BHA); Thứ Ba và Thứ Sáu Lactic Acid (AHA); Thứ Tư và Thứ Bảy Niacinamide rồi Skinoren 20% (Azelaic Acid); Chủ Nhật phục hồi. Mặt nạ cấp ẩm tối Thứ Năm và Chủ Nhật.");
  L.push("Thang tự chấm 1 đến 5: Mụn, Bóng dầu, Khô căng, Đỏ châm chích (5 là nặng nhất); Độ sáng đều màu (5 là tốt nhất). Điểm da 0 đến 100, cao là tốt. Mục tiêu nước: " + goal() + " ly x " + glassMl() + " ml.");
  L.push("Nhật ký 14 ngày gần nhất:");
  let any = false;
  for (let i = 13; i >= 0; i--){
    const k = addDays(t, -i), r = state.days[k]; if (!r) continue; any = true;
    const c = completion(k), sc = skinScore(r);
    const ms = METRICS.filter(m => r.metrics && r.metrics[m.id]).map(m => m.name + " " + r.metrics[m.id]).join(", ");
    L.push("- " + WD[dowOf(k)] + " " + fmtShort(k) + ": sáng " + c.dm + "/" + c.tm + ", tối " + c.de + "/" + c.te + " bước (" + NIGHTS[nightType(k, r)].label + ")" + (r.sensitive ? ", bật chế độ da nhạy cảm" : "") +
      "; nước " + (r.water || 0) + "/" + goal() + " ly" + (ms ? "; chỉ số: " + ms : "") + (sc != null ? "; điểm da " + sc : "") + (r.factors && r.factors.length ? "; yếu tố: " + r.factors.join(", ") : "") + (r.note ? "; ghi chú: " + r.note : ""));
  }
  if (!any) L.push("- Chưa có dữ liệu.");
  L.push("Sản phẩm đang có: " + (state.products.items || []).map(p => p.name + (p.opened ? " (mở " + fmtFull(p.opened) + ")" : "") + (p.trialStart ? " (đang thử từ " + fmtFull(p.trialStart) + ")" : "") + (p.low ? " (sắp hết)" : "")).join("; ") + ".");
  return L.join("\n");
}
function errCopy(code){
  return ({not_granted:"Bạn chưa cho phép trợ lý hoạt động. Mở lại app để cấp quyền.", rate_limited:"Đang có quá nhiều yêu cầu. Thử lại sau ít phút.", cancelled:"Đã dừng."})[code] || "Trợ lý chưa trả lời được. Thử lại sau.";
}
async function ask(question){
  if (!sampleCap || state.busy) return null;
  state.chat.push({role:"user", content:question});
  const bubble = {role:"assistant", content:""}; state.chat.push(bubble);
  state.busy = true;
  if (currentView() !== "advisor") location.hash = "advisor"; else renderAdvisor();
  window.scrollTo({top:document.body.scrollHeight});
  const turns = state.chat.slice(0, -1).map(m => ({role:m.role, content:m.content}));
  turns[0] = {role:"user", content:RULES + "\n\n" + buildContext() + "\n\nNgười dùng hỏi: " + turns[0].content};
  const idx = state.chat.length - 1;
  try {
    const res = await sampleCap(turns, {cache:false, onText:({text}) => { bubble.content = text; const el = document.getElementById("msg" + idx); if (el) el.innerHTML = md(text); }});
    bubble.content = res.text;
    return res.text;
  } catch (e){
    state.chat.splice(-2, 2); toast(errCopy(e && e.code)); return null;
  } finally {
    state.busy = false;
    if (currentView() === "advisor") renderAdvisor();
  }
}
async function askDay(k){
  state.chat = [];
  const label = k === todayKey() ? "hôm nay" : "ngày " + fmtFull(k);
  const text = await ask("Nhận xét tình trạng da " + label + " dựa trên chỉ số, ghi chú và lượng nước. Tối nay và mấy ngày tới tôi nên lưu ý gì?");
  if (text){ ensureDay(k).ai = text; saveDay(k); }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action;
  if (a === "timer"){ e.stopPropagation(); startTimer(Number(el.dataset.min), el.dataset.label); return; }
  if (a === "timer-stop"){ stopTimer(); return; }
  if (a === "toggle"){
    const k = el.dataset.k || todayKey(), rec = ensureDay(k), part = el.dataset.part, id = el.dataset.step;
    rec[part] = Object.assign({}, rec[part]); rec[part][id] = !rec[part][id]; if (!rec[part][id]) delete rec[part][id];
    const before = completion(k).pct;
    saveDay(k); render();
    if (completion(k).pct >= 1 && before < 1) toast(k === todayKey() ? "Hoàn thành trọn vẹn hôm nay" : "Đã đủ bước ngày " + fmtFull(k));
    return;
  }
  if (a === "sensitive"){ const k = todayKey(), rec = ensureDay(k); rec.sensitive = !rec.sensitive; saveDay(k); renderToday(); return; }
  if (a === "glass" || a === "water-add"){
    const k = el.dataset.k, rec = ensureDay(k), before = rec.water || 0;
    if (a === "water-add") rec.water = before + 1;
    else { const i = Number(el.dataset.i); rec.water = before === i + 1 ? i : i + 1; }
    saveDay(k); render();
    if (rec.water >= goal() && before < goal()) toast("Đã đủ " + goal() + " ly nước hôm nay");
    return;
  }
  if (a === "log-today"){ state.logDate = todayKey(); return; }
  if (a === "ldate"){ const n = addDays(state.logDate, Number(el.dataset.d)); if (n <= todayKey()){ state.logDate = n; renderCheckin(); } return; }
  if (a === "metric"){ const k = state.logDate, rec = ensureDay(k); rec.metrics = Object.assign({}, rec.metrics); const v = Number(el.dataset.v); if (rec.metrics[el.dataset.m] === v) delete rec.metrics[el.dataset.m]; else rec.metrics[el.dataset.m] = v; saveDay(k); renderCheckin(); return; }
  if (a === "factor"){ const k = state.logDate, rec = ensureDay(k), f = el.dataset.f, s = new Set(rec.factors || []); s.has(f) ? s.delete(f) : s.add(f); rec.factors = [...s]; saveDay(k); renderCheckin(); return; }
  if (a === "calday"){ state.logDate = el.dataset.k; location.hash = "checkin"; return; }
  if (a === "calm"){ const b = state.calMonth || parseKey(todayKey()); state.calMonth = new Date(b.getFullYear(), b.getMonth() + Number(el.dataset.d), 1); renderProgress(); return; }
  if (a === "ask-day"){ askDay(state.logDate); return; }
  if (a === "ask-today"){ askDay(todayKey()); return; }
  if (a === "ask-trend"){ state.chat = []; ask("Nhìn nhật ký 14 ngày, da tôi đang tiến triển thế nào? Chỉ ra xu hướng và yếu tố nào có vẻ ảnh hưởng nhiều nhất."); return; }
  if (a === "ask-adjust"){ state.chat = []; ask("Dựa trên nhật ký 14 ngày, lịch hoạt chất hiện tại có cần điều chỉnh gì không?"); return; }
  if (a === "ask-send"){ const box = $("#ask"); const q = box.value.trim(); if (!q) return; box.value = ""; ask(q); return; }
  if (a === "chat-clear"){ state.chat = []; renderAdvisor(); return; }
  if (a === "prodimg"){ state.imgFor = el.dataset.id; $("#prodInput").click(); return; }
  if (a === "delprod"){
    const id = el.dataset.id, p = state.products.items.find(x => x.id === id);
    if (!p) return;
    if (state.pendingDel !== id){
      state.pendingDel = id; el.classList.add("armed"); toast("Bấm lần nữa để xóa " + p.name);
      clearTimeout(state.delT); state.delT = setTimeout(() => { state.pendingDel = null; el.classList.remove("armed"); }, 4000);
      return;
    }
    state.pendingDel = null; clearTimeout(state.delT); toast("Đã xóa " + p.name);
    state.products.items = state.products.items.filter(x => x.id !== id); imgDel("prod:" + id);
    saveProducts(); renderRoutine(); return;
  }
  if (a === "low"){ const p = state.products.items.find(x => x.id === el.dataset.id); if (p){ p.low = !p.low; saveProducts(); render(); toast(p.low ? "Đã đánh dấu sắp hết" : "Đã bỏ đánh dấu sắp hết"); } return; }
  if (a === "trial"){
    const p = state.products.items.find(x => x.id === el.dataset.id); if (!p) return;
    if (p.trialStart){ delete p.trialStart; toast("Đã dừng theo dõi " + p.name); }
    else { p.trialStart = todayKey(); toast("Bắt đầu theo dõi " + p.name + " trong 14 ngày"); }
    saveProducts(); render(); return;
  }
  if (a === "backup"){ exportBackup(); return; }
  if (a === "restore"){ $("#restoreInput").click(); return; }
  if (a === "open-backup"){ state.open.add("backup"); return; }
  if (a === "open-products"){ state.open.add("products"); return; }
  if (a === "ask-week"){ state.chat = []; ask("Tóm tắt 7 ngày qua của tôi: mức tuân thủ skincare, lượng nước, điểm da so với tuần trước. Nêu 2 đến 3 việc nên làm trong tuần tới."); return; }
  if (a === "clearopened"){ const p = state.products.items.find(x => x.id === el.dataset.id); if (p){ p.opened = ""; saveProducts(); renderRoutine(); toast("Đã xóa ngày mở nắp"); } return; }
  if (a === "addprod"){ const n = $("#pname").value.trim(); if (!n){ toast("Nhập tên sản phẩm trước."); return; } state.products.items.push({id:"p" + Date.now(), name:n, pao:Number($("#ppao").value), opened:""}); saveProducts(); renderRoutine(); toast("Đã thêm " + n); return; }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "restoreInput"){ const f = el.files && el.files[0]; el.value = ""; if (f) importBackup(f); return; }
  if (el.id === "prodInput"){ const f = el.files && el.files[0]; el.value = ""; if (f && state.imgFor) setProdImage(state.imgFor, f); return; }
  if (el.dataset.action === "opened"){ onOpened(el); return; }
  if (el.dataset.action === "wgoal"){ state.settings.waterGoal = Number(el.value); saveSettings(); toast("Mục tiêu mới: " + el.value + " ly mỗi ngày"); return; }
  if (el.dataset.action === "wml"){ state.settings.glassMl = Number(el.value); saveSettings(); return; }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".step")){ e.preventDefault(); e.target.click(); }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "ask"){ e.preventDefault(); const b = document.querySelector('[data-action="ask-send"]'); if (b) b.click(); }
});
document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.action === "opened") onOpened(e.target); });
document.addEventListener("toggle", e => { const d = e.target; if (d && d.matches && d.matches("details.sec")){ if (d.open) state.open.add(d.dataset.sec); else state.open.delete(d.dataset.sec); } }, true);
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && currentView() === "today") renderToday(); });
setInterval(() => { if (currentView() === "today" && !document.hidden) { const p = document.querySelector(".water-bottom p"); if (p){ const w = waterPace(todayKey()); p.className = w.cls; p.textContent = w.text; } } }, 60000);

/* ---------- boot ---------- */
(async function boot(){
  idb = await openIDB();
  (await kvAll()).forEach(([k, v]) => applyRecord(k, v));
  try {
    for (let i = 0; i < localStorage.length; i++){
      const lk = localStorage.key(i); if (!lk || !lk.startsWith("sa:")) continue;
      const k = lk.slice(3), v = JSON.parse(localStorage.getItem(lk)), cur = currentOf(k);
      if (v && (!cur || (v.updatedAt || 0) > (cur.updatedAt || 0))){ applyRecord(k, v); kvPut(k, v); }
    }
  } catch (e){}
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (!state.products) state.products = {items:DEFAULT_PRODUCTS(), updatedAt:0};
  if (!state.settings) state.settings = {waterGoal:8, glassMl:250, updatedAt:0};
  setSync(); render();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
})();
</script>
